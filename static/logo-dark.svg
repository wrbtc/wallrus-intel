<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 84" width="100" height="84">
  <!--
    Wallrus Intel logo — minimal walrus head profile, facing right.
    Stroke-based design with filled flipper accent.
  -->
  <g fill="none" stroke="#ffffff">

    <!-- Left wall (vertical) -->
    <line x1="8" y1="76" x2="8" y2="20" stroke-width="9" stroke-linecap="square"/>

    <!-- Dome arch + neck: tall arch sweeping right and down -->
    <path d="
      M 8 20
      C 8 -4, 42 -8, 60 0
      C 72 6, 78 14, 78 24
    " stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Snout/muzzle bump protruding from head -->
    <path d="
      M 78 22
      C 79 14, 86 12, 90 16
      C 94 20, 92 29, 87 32
      C 83 34, 79 32, 78 28
    " stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tusks: close-set pair from chin -->
    <path d="M 80 38 L 78 54" stroke-width="5" stroke-linecap="round"/>
    <path d="M 85 37 L 87 54" stroke-width="5" stroke-linecap="round"/>

    <!-- Baseline -->
    <line x1="8" y1="76" x2="86" y2="76" stroke-width="8" stroke-linecap="square"/>

  </g>

  <!-- Flipper: pointed fin rising from baseline, sweeps up-left -->
  <path fill="#ffffff" stroke="none" d="
    M 66 80
    Q 72 62, 80 66
    Q 84 70, 84 78
    L 84 80
    Z
  "/>
</svg>
